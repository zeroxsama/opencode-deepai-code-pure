<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeepAI Code 控制台</title>
<style>
  :root { color-scheme: light dark; }
  html, body { margin: 0; height: 100%; }
  body {
    display: grid; place-items: center;
    font: 13px/1.6 var(--magpie-font, system-ui, -apple-system, "Segoe UI", sans-serif);
    background: var(--magpie-bg, Canvas); color: var(--magpie-fg, CanvasText);
  }
  .box { text-align: center; max-width: 560px; padding: 0 18px; color: var(--magpie-muted, GrayText); }
  .box b { display: block; color: var(--magpie-fg, CanvasText); font-size: 15px; margin-bottom: 8px; }
  .box code { font-family: ui-monospace, Menlo, Consolas, monospace; user-select: all; }
  .box button { margin-top: 10px; font: inherit; padding: 4px 14px; cursor: pointer;
    border: 1px solid rgba(128,128,128,.4); border-radius: 6px; background: transparent; color: inherit; }
  .box p { margin: 6px 0; }
</style>
</head>
<body>
  <div class="box">
    <b>DeepAI Code · 账号管理</b>
    <div id="said">正在连接到账号管理服务…</div>
  </div>
  <script src="_magpie/bridge.js"></script>
  <script src="boot.js"></script>
</body>
</html>
